<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>真岛芳树
    · 留言板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Courier New', monospace;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #e0e0e0;
        }

        .container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(126, 200, 224, 0.3);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #7ec8e0;
            text-shadow: 0 0 8px rgba(126, 200, 224, 0.5);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 12px;
            color: #8a8a8a;
            margin-top: 8px;
        }

        /* 留言表单区域 - Form-Mailer 样式 */
        .form-container {
            background: rgba(20, 20, 30, 0.8);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(126, 200, 224, 0.3);
            backdrop-filter: blur(8px);
        }

        .form-title {
            font-size: 16px;
            color: #7ec8e0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #7ec8e0;
            padding-left: 12px;
        }

        /* Form-Mailer 表单样式 */
        .formmailer-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            color: #ccc;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(126, 200, 224, 0.4);
            border-radius: 12px;
            padding: 12px 14px;
            color: #7ec8e0;
            font-size: 14px;
            font-family: monospace;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #7ec8e0;
            box-shadow: 0 0 8px rgba(126, 200, 224, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            background: rgba(126, 200, 224, 0.2);
            border: 1px solid #7ec8e0;
            border-radius: 40px;
            padding: 12px 20px;
            color: #7ec8e0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .submit-btn:active {
            transform: scale(0.97);
            background: rgba(126, 200, 224, 0.4);
        }

        /* 提示区 */
        .info-box {
            background: rgba(126, 200, 224, 0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 12px;
            color: #8a8a9a;
            border: 1px dashed rgba(126, 200, 224, 0.3);
        }

        .info-box span {
            color: #7ec8e0;
        }

        /* 底部导航 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            margin-top: 30px;
            background: rgba(10, 10, 15, 0.8);
            border-radius: 50px;
            border: 1px solid rgba(126, 200, 224, 0.2);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #8a8a8a;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .nav-item .n-icon {
            font-size: 22px;
        }

        .nav-item.active, .nav-item:active {
            color: #7ec8e0;
            background: rgba(126, 200, 224, 0.15);
        }

        /* 脚注 */
        .footer-note {
            text-align: center;
            font-size: 10px;
            color: #5a5a6a;
            margin-top: 20px;
            padding: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>💬 留言板</h1>
        <p>「想说的话，都可以留在这里」</p>
    </div>

    <!-- 提示信息 -->
    <div class="info-box">
        ✨ 感谢你的留言，每一条我都会认真看。<br>
        留言会通过邮件发送给我，<span>无法公开显示</span>，但我会收到并回复。
    </div>

    <!-- Form-Mailer 留言表单 -->
    <div class="form-container">
        <div class="form-title">
            📝 写下你想说的话
        </div>
        
        <form action="https://ssl.form-mailer.jp/fm/service/Forms/confirm" method="post" name="form1" ENCTYPE="multipart/form-data" accept-charset="UTF-8" class="formmailer-form">
            <input type="hidden" name="key" value="ff424884883948">
            
            <!-- 昵称字段（自定义添加） -->
            <div class="form-group">
                <label>👤 你的昵称（可选）</label>
                <input type="text" name="field_7733953" placeholder="输入你的昵称" style="background:rgba(0,0,0,0.6);border:1px solid rgba(126,200,224,0.4);border-radius:12px;padding:12px 14px;color:#7ec8e0;">
            </div>
            
            <!-- 留言内容（原表单） -->
            <div class="form-group">
                <label>💬 留言内容 <span style="color:#e8788a;">*</span></label>
                <textarea name="field_7733954" rows="5" placeholder="感谢你的留言，全部都有看见"></textarea>
            </div>
            
            <button type="submit" class="submit-btn">📤 发送留言</button>
            
            <input type="hidden" name="code" value="utf8">
        </form>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="n-icon">🏠</span><span>主页</span></a>
        <a href="game.html" class="nav-item"><span class="n-icon">🎮</span><span>游戏</span></a>
        <a href="novels.html" class="nav-item"><span class="n-icon">📖</span><span>小说</span></a>
        <a href="guestbook.html" class="nav-item active"><span class="n-icon">💬</span><span>留言</span></a>
    </div>
    
    <div class="footer-note">
        ✨ 真岛芳树 · 朝夕相伴 ✨
    </div>
</div>

<script>
    // 给表单添加昵称字段的 key（如果需要提交昵称，需要确认 Form-Mailer 后台有对应字段）
    // 注意：如果昵称字段无法提交，可以在 Form-Mailer 后台添加一个叫 field_7733953 的字段
    // 或者直接使用原表单（只留留言内容）。目前昵称字段已添加，可能会被忽略但无影响。
    
    // 页面标题动态效果
    console.log('💬 留言板已加载 — 真岛芳树·朝夕相伴');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>五条悟 · 朝夕相伴</title>
<style>
:root {
--bg: #faf8f5; --card: #ffffff; --text: #3d3226; --text2: #8b7e6a;
--accent: #7eb8c9; --love: #8ec8e0; --gold: #c9a43e; --energy: #b5d0e0;
--hunger: #e0b0a0; --mood-color: #a8c97e;
--font: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #1a1410; font-family: var(--font); color: var(--text);
display: flex; justify-content: center; align-items: center; min-height: 100vh;
padding: 8px; user-select: none; -webkit-user-select: none;
}
.game-container {
width: 100%; max-width: 460px; height: 96vh; max-height: 900px;
background: var(--bg); border-radius: 24px; display: flex; flex-direction: column;
box-shadow: 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; position: relative;
margin: 0 auto;
}
.top-bar {
display: flex; justify-content: space-between; align-items: center;
padding: 14px 18px; background: rgba(255,255,255,0.95);
border-bottom: 1px solid rgba(0,0,0,0.05); flex-shrink: 0;
font-size: 14px; font-weight: 700; backdrop-filter: blur(10px); z-index: 20;
}
.stats-row { display: flex; gap: 4px; padding: 8px 10px; flex-shrink: 0; background: rgba(255,255,255,0.6); backdrop-filter: blur(8px); }
.stat-item { flex: 1; background: #fff; border-radius: 10px; padding: 10px 2px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.04); font-size: 10px; }
.stat-icon { font-size: 18px; } .stat-val { font-weight: 700; font-size: 15px; } .stat-label { font-size: 8px; color: var(--text2); }
.scene-area {
width: 100%; height: 90px; flex-shrink: 0;
display: flex; flex-direction: column; align-items: center; justify-content: center;
position: relative; overflow: hidden; transition: background 0.5s ease;
}
.scene-emoji { font-size: 40px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2)); z-index: 2; }
.scene-label { font-size: 11px; color: #fff; background: rgba(0,0,0,0.35); padding: 4px 10px; border-radius: 6px; z-index: 2; margin-top: 4px; }
.reaction-area {
text-align: center; padding: 8px 12px; font-size: 13px; color: var(--accent); font-weight: 600;
background: rgba(255,255,255,0.9); min-height: 28px; display: flex; align-items: center; justify-content: center;
flex-shrink: 0; border-top: 1px solid rgba(0,0,0,0.05);
}
.content-area { flex: 1; padding: 10px 14px; overflow-y: auto; font-size: 12px; line-height: 1.6; background: rgba(255,255,255,0.4); -webkit-overflow-scrolling: touch; }
.choices-area { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 5px; background: rgba(255,255,255,0.95); border-top: 1px solid rgba(0,0,0,0.05); flex-shrink: 0; backdrop-filter: blur(10px); max-height: 35vh; overflow-y: auto; }
.btn { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #fff; border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
.btn:active { background: var(--accent); color: #fff; transform: scale(0.97); }
.shop-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.shop-tab { padding: 8px 14px; border-radius: 18px; font-size: 12px; cursor: pointer; background: #f0e8d8; color: var(--text2); border: none; font-weight: 600; transition: all 0.2s; }
.shop-tab.active { background: var(--accent); color: #fff; }
.shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.shop-card { background: #fff; border-radius: 10px; padding: 12px 3px; text-align: center; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.shop-card:active { transform: scale(0.94); background: #f5ece0; }
.shop-card .s-emoji { font-size: 28px; } .shop-card .s-name { font-weight: 600; font-size: 10px; } .shop-card .s-price { color: var(--gold); font-weight: 700; font-size: 11px; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
.modal-overlay.show { pointer-events: auto; opacity: 1; }
.modal-box { background: #fff; border-radius: 18px; padding: 22px; width: 88%; max-width: 360px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.4); }
.modal-box h3 { font-size: 16px; color: var(--accent); margin-bottom: 8px; }
.modal-box p { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.6; white-space: pre-line; }
.modal-box button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 6px; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #3d3226; color: #fff; padding: 8px 20px; border-radius: 12px; font-size: 12px; z-index: 300; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.bottom-nav { display: flex; justify-content: space-around; padding: 10px 8px; flex-shrink: 0; background: rgba(255,255,255,0.95); border-top: 1px solid rgba(0,0,0,0.05); backdrop-filter: blur(10px); z-index: 30; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text2); cursor: pointer; padding: 8px 12px; border-radius: 10px; transition: all 0.15s; background: transparent; border: none; text-decoration: none; }
.nav-item:active { background: rgba(0,0,0,0.05); } .nav-item .n-icon { font-size: 26px; } .nav-item.active { color: var(--accent); font-weight: 700; }
.rules-btn { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 14px; cursor: pointer; z-index: 50; background: rgba(255,255,255,0.9); border-radius: 20px; padding: 8px 16px; display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
</style>
</head>
<body>
<div class="game-container" id="app">
<div class="top-bar"><span id="dayLabel">📅 第1天 周一</span><span>💰<b id="moneyVal">150</b></span><span>⏳行动力:<b id="actionVal">3</b>/3</span></div>
<div class="stats-row">
<div class="stat-item"><div class="stat-icon">💕</div><div class="stat-val" id="loveVal" style="color:var(--love);">50</div><div class="stat-label">好感度</div></div>
<div class="stat-item"><div class="stat-icon">🍖</div><div class="stat-val" id="hungerVal" style="color:var(--hunger);">70</div><div class="stat-label">饱腹度</div></div>
<div class="stat-item"><div class="stat-icon">⚡</div><div class="stat-val" id="energyVal" style="color:var(--energy);">75</div><div class="stat-label">精力</div></div>
<div class="stat-item"><div class="stat-icon">💭</div><div class="stat-val" id="moodVal" style="color:var(--mood-color);">65</div><div class="stat-label">心情</div></div>
<div class="stat-item"><div class="stat-icon">🧹</div><div class="stat-val" id="cleanVal" style="color:#7eb8c9;">80</div><div class="stat-label">整洁度</div></div>
</div>
<div class="scene-area" id="sceneArea" style="background:linear-gradient(180deg,#f5efe5,#ebe0d0);"><div class="scene-emoji" id="sceneEmoji">🏠</div><div class="scene-label" id="sceneLabel">家里·客厅</div></div>
<div class="reaction-area" id="reactionArea">五条悟靠在沙发上，手里拿着一盒草莓大福。</div>
<div class="content-area" id="contentMain"></div>
<div class="choices-area" id="choicesMain"></div>
<div class="bottom-nav" id="bottomNav">
<a href="index.html" class="nav-item"><span class="n-icon">🏠</span>主页</a>
<a href="game.html" class="nav-item active"><span class="n-icon">🎮</span>游戏</a>
<a href="novels.html" class="nav-item"><span class="n-icon">📖</span>小说</a>
<a href="guestbook.html" class="nav-item"><span class="n-icon">💬</span>留言</a>
</div>

</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>

<script>
const SK = 'gojo_v1_fix';
function save() { try { localStorage.setItem(SK, JSON.stringify(G)); } catch(e) {} }
function load() { try { let d = JSON.parse(localStorage.getItem(SK)); if(d) { Object.assign(G, d); return true; } } catch(e) {} return false; }

const G = { day: 1, money: 150, actions: 3, love: 50, hunger: 70, energy: 75, mood: 65, cleanliness: 80, phase: 'morning', weekDay: 1, outfit: 'default', inventory: [], zyHome: true, zyAtSchool: false, ownedOutfits: ['default'], lightOn: true, gifts: [], flags: {}, usedEvents: [], eventTriggeredToday: false, dailyLog: [] };
const WN = ['周一','周二','周三','周四','周五','周六','周日'];
const $ = id => document.getElementById(id);

function showReaction(msg) { $('#reactionArea').textContent = msg; setTimeout(() => { if($('#reactionArea').textContent === msg) $('#reactionArea').textContent = ''; }, 4000); }
function checkGameOver() {
if (G.hunger <= 0) { showModal('游戏结束', '五条悟的饱腹度降到了0。', [{ text: '重新开始', cb: () => { localStorage.removeItem(SK); location.reload(); } }]); return true; }
if (G.energy <= 0) { showModal('游戏结束', '五条悟的精力降到了0。', [{ text: '重新开始', cb: () => { localStorage.removeItem(SK); location.reload(); } }]); return true; }
if (G.cleanliness <= 0) { showModal('游戏结束', '五条悟的整洁度降到了0。', [{ text: '重新开始', cb: () => { localStorage.removeItem(SK); location.reload(); } }]); return true; }
if (G.mood <= 0) { showModal('游戏结束', '五条悟的心情降到了0。', [{ text: '重新开始', cb: () => { localStorage.removeItem(SK); location.reload(); } }]); return true; }
return false;
}
function showRules() {
let rules = '📋 游戏规则\n\n🏠 五条悟养成模拟游戏。\n🕐 每天分上午/下午/傍晚/夜晚。\n⏳ 行动力每天3点，出门/做饭/约会等消耗。\n⚠️ 任何数值降到0游戏直接结束！\n🎒 五条悟出门消耗精力。\n🛒 商城购买食物/衣物/礼物。\n🍳 食材需烹饪后才能吃。\n💬 睡前可聊天/亲密互动。\n📅 30天后根据好感度判定结局。';
showModal('📋 游戏规则', rules, [{ text: '知道了', cb: () => {} }]);
}
function showStatChange(title, changes) {
let body = '';
if (changes.love) body += '💕好感度 ' + (changes.love > 0 ? '+' : '') + changes.love + '\n';
if (changes.mood) body += '💭心情 ' + (changes.mood > 0 ? '+' : '') + changes.mood + '\n';
if (changes.energy) body += '⚡精力 ' + (changes.energy > 0 ? '+' : '') + changes.energy + '\n';
if (changes.hunger) body += '🍖饱腹度 ' + (changes.hunger > 0 ? '+' : '') + changes.hunger + '\n';
if (changes.cleanliness) body += '🧹整洁度 ' + (changes.cleanliness > 0 ? '+' : '') + changes.cleanliness + '\n';
if (changes.money) body += '💰金币 ' + (changes.money > 0 ? '+' : '') + changes.money + '\n';
if (body) showModal(title, body, [{ text: '确定', cb: () => {} }]);
}

function updateUI() { $('#dayLabel').textContent = '📅 第' + G.day + '天 ' + WN[G.weekDay]; $('#moneyVal').textContent = G.money; $('#actionVal').textContent = G.actions; $('#loveVal').textContent = Math.round(G.love); $('#hungerVal').textContent = Math.round(G.hunger); $('#energyVal').textContent = Math.round(G.energy); $('#moodVal').textContent = Math.round(G.mood); $('#cleanVal').textContent = Math.round(G.cleanliness); }
function toast(msg) { let t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
function showModal(title, body, buttons) { let m = $('#modalOverlay'), b = $('#modalBox'); b.innerHTML = '<h3>' + title + '</h3><p>' + body + '</p>'; if (buttons) buttons.forEach(btn => { let el = document.createElement('button'); el.textContent = btn.text; el.addEventListener('click', () => { m.classList.remove('show'); if (btn.cb) btn.cb(); }); b.appendChild(el); }); else { let cb = document.createElement('button'); cb.textContent = '关闭'; cb.addEventListener('click', () => m.classList.remove('show')); b.appendChild(cb); } m.classList.add('show'); }
function spendAction() { if (G.actions > 0) { G.actions--; updateUI(); return true; } toast('行动力用完了'); return false; }
function addContent(html) { let el = document.createElement('p'); el.innerHTML = html; $('#contentMain').appendChild(el); $('#contentMain').scrollTop = $('#contentMain').scrollHeight; }
function setChoices(arr) { $('#choicesMain').innerHTML = ''; arr.forEach(c => { let btn = document.createElement('div'); btn.className = 'btn' + (c.disabled ? ' disabled' : ''); btn.innerHTML = '<span>' + c.text + '</span><span style="font-size:10px;opacity:0.7;">' + (c.cost || '') + '</span>'; if (!c.disabled) btn.addEventListener('click', c.action); $('#choicesMain').appendChild(btn); }); }

var currentScreen = 'main';
var screenData = {};
function createScreen(id, title, bg, emoji, label) { screenData[id] = { title, bg, emoji, label }; }
createScreen('bedroom', '🛏️ 卧室', 'linear-gradient(180deg,#1a1a2e,#0d0d1a)', '🛏️', '卧室');
createScreen('dining', '🍽️ 餐厅', 'linear-gradient(180deg,#fff8f0,#f5e6d3)', '🍽️', '餐厅');
createScreen('bath', '🚿 浴室', 'linear-gradient(180deg,#e0f0ff,#c0ddf8)', '🚿', '浴室');
createScreen('wardrobe', '👔 衣帽间', 'linear-gradient(180deg,#f5f0f0,#e8dcdc)', '👔', '衣帽间');
createScreen('shop', '🛒 商城', 'linear-gradient(180deg,#f8f8f0,#f0f0e0)', '🛒', '商城');
createScreen('city', '🗺️ 出门', 'linear-gradient(180deg,#e0f0e0,#c8e0c8)', '🗺️', '城市地图');

function switchScreen(id) {
currentScreen = id; 
if (id === 'shop') renderShop(); else if (id === 'dining') renderDining(); else if (id === 'bath') renderBath(); else if (id === 'bedroom') renderBedroom(); else if (id === 'wardrobe') renderWardrobe(); else if (id === 'city') renderCity(); else if (id === 'main') { updateUI(); showPhase(); }
$('#sceneArea').style.background = screenData[id] ? screenData[id].bg : 'linear-gradient(180deg,#f5efe5,#ebe0d0)';
$('#sceneEmoji').textContent = screenData[id] ? screenData[id].emoji : '🏠';
$('#sceneLabel').textContent = screenData[id] ? screenData[id].label : '家里·客厅';
$('#contentMain').innerHTML = ''; $('#choicesMain').innerHTML = ''; $('#reactionArea').textContent = '';
$('#rulesBtn').style.display = (id === 'main') ? 'flex' : 'none';
}

function renderBedroom() {

if (G.lightOn) { html += '<p>五条悟' + pose + '。看到你进来，他往旁边挪了挪，给你腾出位置。</p>'; } else { html += '<p>房间很暗，只有窗外的月光。五条悟已经躺下了，呼吸均匀。</p>'; }
$('#contentMain').innerHTML = html;
chatRound = 0;
$('#choicesMain').innerHTML = '';
if (G.lightOn) {
[{ text: '💬 聊聊天', action: () => startChat() },
{ text: '🤗 亲密互动', action: () => showIntimacy() },
{ text: '🌙 熄灯睡觉', action: () => { let warnings = []; if (G.hunger - 25 <= 0) warnings.push('⚠️ 饱腹度将在过夜后降为0！'); if (G.cleanliness - 18 <= 0) warnings.push('⚠️ 整洁度将在过夜后降为0！'); if (warnings.length > 0) { showModal('⚠️ 警告', warnings.join('\n') + '\n\n确定要睡觉吗？', [{ text: '确定睡觉', cb: () => { G.lightOn = false; updateUI(); showLogAndEndDay(); } }, { text: '再等等', cb: () => {} }]); } else { showModal('确认', '要熄灯睡觉吗？\n今天就要结束了。', [{ text: '是的，晚安', cb: () => { G.lightOn = false; updateUI(); showLogAndEndDay(); } }, { text: '再待一会儿', cb: () => {} }]); } }}].forEach(c => { let btn = document.createElement('div'); btn.className = 'btn'; btn.innerHTML = '<span>' + c.text + '</span>'; btn.addEventListener('click', c.action); $('#choicesMain').appendChild(btn); });

}

function generateLog() { let log = ''; let isWeekend = G.weekDay >= 5; if (!isWeekend) { log += '今天出门逛了逛。'; if (G.energy < 30) log += '有点累，但买到了好吃的甜品。'; else log += '逛了几个景点，还买了伴手礼。'; } else { log += '今天在家休息。'; } if (G.dailyLog.length > 0) { for (let entry of G.dailyLog) { log += entry + ' '; } } if (G.hunger < 30) log += '肚子有点饿了... '; if (G.cleanliness < 30) log += '想泡个澡... '; if (G.mood < 30) log += '今天心情不太好。 '; if (G.mood > 80) log += '今天特别开心！ '; if (G.love > 80) log += '越来越喜欢你了。 '; if (G.eventTriggeredToday && G.usedEvents && G.usedEvents.length > 0) { log += '今天发生了一件特别的事。 '; } if (log === '') log += '今天是平静的一天。'; return log.trim(); }

{ title: '☔ 躲雨甜品店', body: '逛街时突然下起大雨，你们就近躲进街边的甜品店。五条悟点了两份热甜品，坐在窗边看着雨水顺着玻璃流下来。', choices: [{ text: '和他一起慢慢吃', changes: {love:6, mood:12, energy:-1}, react: '五条悟用勺子挖了一口递到你面前：“尝尝，这个不会太甜。”' },{ text: '抱怨天气不好', changes: {love:1, mood:-2, energy:0}, react: '五条悟伸手揉了揉你的头发：“偶尔这样也不错嘛，你看，甜品很好吃。”' },{ text: '说在这待到雨停', changes: {love:4, mood:8, energy:0}, react: '五条悟点点头，又叫了一份：“那再点个这个，反正有时间。”' }] }
];

function triggerRandomEvent() { if (G.eventTriggeredToday) return; let available = []; for (let i = 0; i < allEvents.length; i++) { if (!G.usedEvents || G.usedEvents.indexOf(i) === -1) available.push(i); } if (available.length === 0) { G.usedEvents = []; for (let j = 0; j < allEvents.length; j++) available.push(j); } let pickIdx = available[Math.floor(Math.random() * available.length)]; if (!G.usedEvents) G.usedEvents = []; G.usedEvents.push(pickIdx); G.eventTriggeredToday = true; save(); let evt = allEvents[pickIdx]; let btns = evt.choices.map(c => ({ text: c.text, cb: () => { if (c.changes) { if (c.changes.love) G.love = Math.max(0, Math.min(100, G.love + c.changes.love)); if (c.changes.mood) G.mood = Math.max(0, Math.min(100, G.mood + c.changes.mood)); if (c.changes.energy) G.energy = Math.max(0, Math.min(100, G.energy + c.changes.energy)); if (c.changes.hunger) G.hunger = Math.max(0, Math.min(100, G.hunger + c.changes.hunger)); if (c.changes.cleanliness) G.cleanliness = Math.max(0, Math.min(100, G.cleanliness + c.changes.cleanliness)); if (c.changes.money) G.money = Math.max(0, G.money + c.changes.money); } updateUI(); save(); showReaction(c.react); showStatChange(evt.title, c.changes || {}); G.dailyLog.push('今天发生了一件事：' + evt.title + '。'); if (checkGameOver()) return; } })); showModal('⚡ ' + evt.title, evt.body, btns); }

function showPhase() {
updateUI(); $('#sceneArea').style.background = 'linear-gradient(180deg,#f5efe5,#ebe0d0)'; $('#sceneEmoji').textContent = '🏠'; $('#sceneLabel').textContent = '家里·客厅';
let isWeekend = G.weekDay >= 5;
if (G.phase === 'morning') { $('#contentMain').innerHTML = ''; if (!isWeekend) addContent('清晨。五条悟正在翻冰箱，看有什么甜品可以当早餐。吃完早餐他打算出门逛逛。'); else addContent('周末的早晨。阳光透过窗帘洒进来，五条悟翻了个身。今天他在家。'); addContent('<b>☀️ 上午</b>'); let choices = []; if (isWeekend) { choices.push({ text: '🚪 出门约会', action: () => switchScreen('city') }); choices.push({ text: '🏠 在家休息', action: () => { G.phase = 'afternoon'; showPhase(); } }); } else { choices.push({ text: '🎒 让五条悟出门逛逛', action: () => { G.zyAtSchool = true; G.zyHome = false; G.energy = Math.max(0, G.energy - 10); G.phase = 'afternoon'; addContent('五条悟戴上墨镜出门了。“我走了，回来给你带伴手礼。”'); showPhase(); if (checkGameOver()) return; } }); choices.push({ text: '💼 去上班 (+120💰, 消耗1行动力)', action: () => { if (!spendAction()) return; G.money += 120; G.phase = 'afternoon'; addContent('你忙碌了一上午。终于到了午休时间。'); showStatChange('上班', {money:120}); showPhase(); } }); choices.push({ text: '🏠 请假在家', action: () => { G.phase = 'afternoon'; showPhase(); } }); } choices.push({ text: '🎒 查看物品栏', action: () => { $('#contentMain').innerHTML = renderInventorySection(); setChoices([{ text: '🔙 返回', action: () => showPhase() }]); } }); $('#contentMain').innerHTML += renderInventorySection(); setChoices(choices); }
else if (G.phase === 'afternoon') { let zyHome = isWeekend || (!G.zyAtSchool && Math.random() < 0.6); if (!isWeekend && G.zyAtSchool) zyHome = false; if (isWeekend) zyHome = true; G.zyHome = zyHome; $('#contentMain').innerHTML = ''; if (G.zyHome) addContent('下午。五条悟已经从外面回来了，手里提着一袋甜品。'); else addContent('下午。五条悟还在外面，傍晚才能回来。'); addContent('<b>🌤️ 下午</b>'); let c = []; if (!G.zyHome) c.push({ text: '🏠 等五条悟回家', action: () => { G.zyHome = true; G.zyAtSchool = false; G.phase = 'evening'; addContent('五条悟推开门走了进来。“我回来了，给你带了伴手礼。”'); showPhase(); } }); $('#contentMain').innerHTML += renderInventorySection(); setChoices(c); }
else if (G.phase === 'evening') { G.zyHome = true; G.zyAtSchool = false; $('#contentMain').innerHTML = ''; addContent('傍晚。五条悟系上围裙，开始在厨房里准备甜品。'); addContent('<b>🌅 傍晚</b>'); setChoices([{ text: '🛋️ 陪他窝在沙发上看电视', action: () => { G.love = Math.min(100, G.love + 1); G.energy = Math.min(100, G.energy + 3); addContent('你们窝在沙发上。五条悟把头搭在你肩上。'); showReaction('五条悟靠在你身边，轻声说：“这个节目还挺好看的。”'); G.phase = 'night'; showPhase(); } }]); $('#contentMain').innerHTML += renderInventorySection(); }
else if (G.phase === 'night') { G.zyHome = true; $('#contentMain').innerHTML = ''; addContent('🌙 夜深了。五条悟应该在卧室里。'); setChoices([{ text: '🛏️ 去卧室', action: () => switchScreen('bedroom') }]); $('#contentMain').innerHTML += renderInventorySection(); }
if (G.zyHome && !G.eventTriggeredToday && G.phase !== 'morning' && Math.random() < 0.5) { triggerRandomEvent(); }
}

if (!load()) { addContent('<b>📅 第1天 · 周一</b>'); addContent('五条悟靠在沙发上，手里拿着一盒草莓大福。'); addContent('他推了推墨镜，朝你笑了笑：“今天有什么好吃的吗？”'); }
G.dailyLog = [];
if (!G.lightOn && G.phase === 'night') { G.lightOn = true; }
updateUI(); showPhase();
showRules();
</script>

    // 存储当前替换名字
    let currentReplaceName = localStorage.getItem('readerName') || '';
    let currentReplaceShort = localStorage.getItem('readerShortName') || '';

    // 执行文本替换
    function replaceNamesInText(text, fullName, shortName) {
        let result = text;
        if (fullName && fullName.trim()) {
            result = result.split('江穗').join(fullName);
        }
        if (shortName && shortName.trim()) {
            result = result.split('穗').join(shortName);
        }
        return result;
    }

    // 渲染小说列表
    function renderNovels() {
        const container = document.getElementById('novelsList');
        if (!container) return;

        let html = '';
        for (let novel of novelsData) {
            const tagsHtml = novel.tags.map(t => `<span class="tag">${t}</span>`).join('');
            // 预览摘要（前120字）
            let preview = novel.fullText.replace(/\n/g, ' ').substring(0, 120);
            if (preview.length < novel.fullText.length) preview += '...';
            
            html += `
                <div class="novel-card" data-id="${novel.id}">
                    <div class="novel-header" onclick="toggleNovel(${novel.id})">
                        <div>
                            <div class="novel-title">${escapeHtml(novel.title)}</div>
                            <div class="novel-tags">${tagsHtml}</div>
                        </div>
                        <div class="expand-icon">▼</div>
                    </div>
                    <div class="novel-content">
                        <div class="novel-body" id="novelBody-${novel.id}"></div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        
        // 填充正文（替换名字后）
        for (let novel of novelsData) {
            const bodyDiv = document.getElementById(`novelBody-${novel.id}`);
            if (bodyDiv) {
                const replacedText = replaceNamesInText(novel.fullText, currentReplaceName, currentReplaceShort);
                bodyDiv.innerHTML = replacedText.replace(/\n/g, '<br>');
            }
        }
    }

    // 辅助函数：防止XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 切换展开/收起
    window.toggleNovel = function(id) {
        const card = document.querySelector(`.novel-card[data-id="${id}"]`);
        if (card) {
            card.classList.toggle('expanded');
        }
    };

    // 保存名字设置
    function saveNameSettings() {
        const nameInput = document.getElementById('replaceName');
        const shortInput = document.getElementById('replaceShortName');
        if (nameInput) {
            currentReplaceName = nameInput.value.trim();
            localStorage.setItem('readerName', currentReplaceName);
        }
        if (shortInput) {
            currentReplaceShort = shortInput.value.trim();
            localStorage.setItem('readerShortName', currentReplaceShort);
        }
        // 重新渲染正文
        for (let novel of novelsData) {
            const bodyDiv = document.getElementById(`novelBody-${novel.id}`);
            if (bodyDiv) {
                const replacedText = replaceNamesInText(novel.fullText, currentReplaceName, currentReplaceShort);
                bodyDiv.innerHTML = replacedText.replace(/\n/g, '<br>');
            }
        }
        // 显示保存提示
        const hint = document.querySelector('.preview-hint');
        if (hint) {
            const originalText = hint.innerHTML;
            hint.innerHTML = '✅ 已保存！小说中的名字已替换。';
            setTimeout(() => {
                if (hint) hint.innerHTML = originalText;
            }, 2000);
        }
    }

    // 初始化输入框
    function initInputs() {
        const nameInput = document.getElementById('replaceName');
        const shortInput = document.getElementById('replaceShortName');
        if (nameInput) nameInput.value = currentReplaceName;
        if (shortInput) shortInput.value = currentReplaceShort;
    }

    // 绑定保存按钮
    function bindEvents() {
        const saveBtn = document.getElementById('saveNameBtn');
        if (saveBtn) {
            saveBtn.addEventListener('click', saveNameSettings);
        }
    }

    // 页面加载
    renderNovels();
    initInputs();
    bindEvents();
</script>

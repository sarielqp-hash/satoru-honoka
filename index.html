<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>五条悟 · 主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Courier New', monospace;
            position: relative;
            overflow: hidden;
        }

        /* 背景图片层 */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('b3d87e49022b86ae241aed3c95bb371d.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        /* 下雨效果层 */
        .rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .rain-drop {
            position: absolute;
            top: -10px;
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.6);
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        /* 主内容容器 */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            margin: 20px auto;
            padding: 40px 24px;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(126, 200, 224, 0.4);
            text-align: center;
        }

        /* 入口按钮 */
        .entry-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(20, 20, 30, 0.9);
            border: 1px solid rgba(126, 200, 224, 0.5);
            border-radius: 60px;
            color: #7ec8e0;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn span {
            font-size: 24px;
        }

        .btn:active {
            transform: scale(0.97);
            background: rgba(126, 200, 224, 0.2);
        }

        /* 底部导航栏 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 8px;
            margin-top: 30px;
            border-top: 1px solid rgba(126, 200, 224, 0.2);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 40px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #8a8a8a;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .nav-item .n-icon {
            font-size: 22px;
        }

        .nav-item.active, .nav-item:active {
            color: #7ec8e0;
            background: rgba(126, 200, 224, 0.15);
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="rain" id="rainContainer"></div>
    
    <div class="container">
        <div class="entry-buttons">
            <a href="game.html" class="btn">
                <span>🎮</span> 进入游戏
            </a>
            <a href="novels.html" class="btn">
                <span>📖</span> 小说馆
            </a>
            <a href="guestbook.html" class="btn">
                <span>💬</span> 留言板
            </a>
        </div>
        
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <span class="n-icon">🏠</span>
                <span>主页</span>
            </a>
            <a href="game.html" class="nav-item">
                <span class="n-icon">🎮</span>
                <span>游戏</span>
            </a>
            <a href="novels.html" class="nav-item">
                <span class="n-icon">📖</span>
                <span>小说</span>
            </a>
            <a href="guestbook.html" class="nav-item">
                <span class="n-icon">💬</span>
                <span>留言</span>
            </a>
        </div>
    </div>

    <script>
        // 下雨效果
        function createRain() {
            const rainContainer = document.getElementById('rainContainer');
            for (let i = 0; i < 60; i++) {
                const drop = document.createElement('div');
                drop.classList.add('rain-drop');
                drop.style.left = Math.random() * 100 + '%';
                drop.style.animationDuration = Math.random() * 1.5 + 0.8 + 's';
                drop.style.animationDelay = Math.random() * 5 + 's';
                drop.style.opacity = Math.random() * 0.5 + 0.2;
                drop.style.height = Math.random() * 20 + 8 + 'px';
                rainContainer.appendChild(drop);
            }
        }
        createRain();
    </script>
</body>
</html>
